<!DOCTYPE html>
<html>
    <head>
        <title>Live</title>
        <link rel="stylesheet" href="/style.css">
        <style>
            html {
                --card-width: 480px;
                --score-width: 96px;
                --logo-width: 76px;
                --color-team1: #2294f1;
                --color-team2: #f55521;
            }

            main {
                display: flex;
                align-items: center;
                flex-direction: column;
            }

            #tournament {
                font-weight: 400;
                background-color: #1a1a1c;
                width: min(100%, 500px);
                text-align: center;
                text-transform: uppercase;
                padding: 0.6rem 1.2rem;
                border-radius: 0 0 16px 16px;
                color: white;
                z-index: 100;
            }

            #scoreboard {
                display: grid;
                grid-template-columns: var(--card-width) max-content var(--card-width);
                align-items: center;
                justify-content: center;
                gap: 2rem;

                #time-and-score {
                    display: grid;
                    grid-template-columns: var(--score-width) 170px var(--score-width);
                    grid-template-rows: 84px;
                    text-align: center;
                    align-items: center;

                    #time {
                        background-color: white;
                        font-size: 2.6em;
                        font-weight: 600;
                        border-radius: 16px;
                        box-shadow: 0 0 12px 0 rgba(0, 0, 0, 0.4);
                        height: 100%;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                    }

                    #score-team1,
                    #score-team2 {
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 2.8em;
                        font-weight: 700;
                        height: 100%;
                        color: white;
                        position: relative;
                        z-index: -1;

                        &::before {
                            content: '';
                            position: absolute;
                            top: 0;
                            bottom: 0;
                            width: 20px;
                        }
                    }

                    #score-team1 {
                        border-radius: 16px 0 0 16px;
                        background-color: var(--color-team1);

                        &::before {
                            left: 100%;
                            background-color: var(--color-team1);
                        }
                    }

                    #score-team2 {
                        border-radius: 0 16px 16px 0;
                        background-color: var(--color-team2);

                        &::before {
                            right: 100%;
                            background-color: var(--color-team2);
                        }
                    }
                }

                section:not(#time-and-score) {
                    display: grid;
                    grid-template-columns: 1fr var(--logo-width);
                    height: 62px;
                    background-color: #2b2b2b;
                    border-radius: 16px;
                    align-items: center;

                    &:first-of-type {
                        grid-template-columns: var(--logo-width) 1fr;
                    }

                    p {
                        z-index: 1;
                        display: inline-flex;
                        text-transform: uppercase;
                        font-size: 1.6em;
                        font-weight: 700;
                        color: white;
                        align-items: center;
                        justify-content: center;
                        height: 100%;
                        border-radius: 16px;
                        position: relative;
                        color: var(--color-team1);

                        &::before {
                            z-index: -1;
                            content: '';
                            position: absolute;
                            top: 0;
                            bottom: 0;
                            left: 0;
                            right: 0;
                            background-image: url("/card.png");
                            background-blend-mode: soft-light;
                            border-radius: 16px;
                            pointer-events: none;
                            background-color: #1a1a1c;
                        }
                    }

                    #name-team2 {
                        color: var(--color-team2);

                        &::before {
                            transform: scaleX(-1);
                        }
                    }

                    div {
                        height: 100%;
                        width: 100%;
                        padding: 0.5rem;

                        img {
                            width: inherit;
                            height: inherit;
                            object-fit: contain;
                            display: inline-flex;
                            align-items: center;
                            justify-content: center;
                            opacity: 0;
                        }
                    }
                }
            }

            #entities {
                padding-top: 3rem;
                width: 100%;
                display: flex;
                justify-content: space-between;
                gap: 2rem;

                > section {
                    display: flex;
                    flex-direction: column;
                    gap: 0.6rem;

                    > div {
                        background-color: #1a1a1c;
                        color: white;
                        padding: 0.6rem 0.7rem;
                        width: 260px;
                        border-radius: 0 8px 8px 0;
                        display: flex;
                        flex-direction: column;
                        gap: 0.4rem;

                        > div:nth-of-type(1) {
                            display: flex;
                            flex-direction: row;
                            justify-content: space-between;
                            gap: 0.2rem;

                            > p:nth-of-type(1) {
                                font-weight: 600;
                                color: var(--color-team1);
                            }
                        }

                        > div:nth-child(2) {
                            width: 100%;
                            height: 4px;
                            border-radius: 2px;
                            background-color: #2b2b2b;
                            position: relative;
                            overflow: hidden;

                            > i {
                                transition: width 115ms linear;
                                position: absolute;
                                top: 0;
                                bottom: 0;
                                left: 0;
                                right: 0;
                                width: 0%;
                                background-color: var(--color-team1);
                            }
                        }
                    }
                }

                > section:last-of-type > div {
                    border-radius: 8px 0 0 8px;

                    > div:nth-child(1) {
                        flex-direction: row-reverse;

                        > p:nth-of-type(1) {
                            color: var(--color-team2);
                        }
                    }

                    > div:nth-child(2) {
                        transform: scaleX(-1);
                        > i {
                            background-color: var(--color-team2);
                        }
                    }
                }
            }
        </style>
    </head>
    <body>
        <main>
            <article id="tournament">
                &nbsp;
            </article>

            <article id="scoreboard">
                <!-- Team 1 -->
                <section>
                    <div>
                        <img id="logo-team1" src="" />
                    </div>
                    <p id="name-team1">&nbsp;</p>
                </section>

                <!-- Time and score -->
                <section id="time-and-score">
                    <p id="score-team1">0</p>
                    <p id="time">0:00</p>
                    <p id="score-team2">0</p>
                </section>

                <!-- Team 2 -->
                <section>
                    <p id="name-team2">&nbsp;</p>
                    <div>
                        <img id="logo-team2" src="" />
                    </div>
                </section>
            </article>

            <article id="entities">
                <!-- Team 1 -->
                <section id="entities-team1"></section>

                <!-- Team 2 -->
                <section id="entities-team2"></section>
            </article>
        </main>

        <script>
            const url = window.location.href.split('//')[1].split('/')[0];
            const tournamentId = window.location.pathname.split('/')[2];
            const isLocal = url.startsWith('localhost');
            let data = {};

            const tournament = document.getElementById('tournament');
            const nameTeam1 = document.getElementById('name-team1');
            const nameTeam2 = document.getElementById('name-team2');
            const logoTeam1 = document.getElementById('logo-team1');
            const logoTeam2 = document.getElementById('logo-team2');
            const time = document.getElementById('time');
            const scoreTeam1 = document.getElementById('score-team1');
            const scoreTeam2 = document.getElementById('score-team2');
            const entitiesTeam1 = document.getElementById('entities-team1');
            const entitiesTeam2 = document.getElementById('entities-team2');

            function setTournamentInfos() {
                let tournamentInfos = [];
                if (data?.tournament?.name) tournamentInfos.push(data.tournament.name);
                if (data?.season?.name) tournamentInfos.push(data.season.name);
                tournament.innerHTML = tournamentInfos?.join('&nbsp; - &nbsp;') || '&nbsp;';
            }

            function setTeams() {
                nameTeam1.innerHTML = data?.versus?.team1?.name || '&nbsp;';
                nameTeam2.innerHTML = data?.versus?.team2?.name || '&nbsp;';

                logoTeam1.src = data?.versus?.team1?.logo ? `data:image/png;base64,${data.versus.team1.logo || ''}` : '';
                logoTeam1.style.opacity = data?.versus?.team1?.logo ? '1' : '0';

                logoTeam2.src = data?.versus?.team2?.logo ? `data:image/png;base64,${data.versus.team2.logo || ''}` : '';
                logoTeam2.style.opacity = data?.versus?.team2?.logo ? '1' : '0';

                document.documentElement.style.setProperty('--color-team1', data?.versus?.team1?.color || '#2294f1');
                document.documentElement.style.setProperty('--color-team2', data?.versus?.team2?.color || '#f55521');
            }

            function setScoreboard() {
                time.innerHTML = data?.match ? `${data.match?.isOvertime ? '+' : ''}${Math.floor(data.match?.time / 60)}:${(data.match?.time % 60).toString().padStart(2, "0")}` : '0:00';
                scoreTeam1.innerHTML = data?.match?.score[0] || '0';
                scoreTeam2.innerHTML = data?.match?.score[1] || '0';
            }

            function setPlayers() {
                entitiesTeam1.innerHTML = '';
                entitiesTeam2.innerHTML = '';

                if (data?.players) {
                    Object.keys(data.players).forEach((team) => {
                        if (data?.players[team]) {
                            Object.keys(data.players[team]).forEach((player) => {
                                const name = document.createElement('p');
                                name.innerHTML = player.split('|').slice(3).join('|');
                                const boost = document.createElement('p');
                                boost.id = `boost-${player}`;

                                const boostValue = data.entities?.cars && data.entities?.cars[team] && data.entities?.cars[team][player]?.boost || 0
                                boost.innerHTML = boostValue;
                                const text = document.createElement('div');
                                text.append(name, boost);

                                const barValue = document.createElement('i');
                                barValue.id = `bar-${player}`;
                                barValue.style.width = `${boostValue}%`;
                                const bar = document.createElement('div');
                                bar.appendChild(barValue);

                                const wrapper = document.createElement('div');
                                wrapper.id = player;
                                wrapper.append(text, bar);

                                if (team == 0) entitiesTeam1.appendChild(wrapper);
                                else entitiesTeam2.appendChild(wrapper);
                            })
                        }
                    })
                }
            }

            function setEntities() {
                if (data?.entities?.cars) {
                    Object.keys(data.entities.cars).forEach((team) => {
                        if (data?.entities?.cars[team]) {
                            Object.keys(data.entities.cars[team]).forEach((player) => {
                                const boostValue = data.entities?.cars && data.entities?.cars[team] && data.entities?.cars[team][player]?.boost || 0
                                const boost = document.getElementById(`boost-${player}`);
                                if (boost) boost.innerHTML = boostValue;
                                const bar = document.getElementById(`bar-${player}`);
                                if (bar) bar.style.width = `${boostValue}%`;
                            })
                        }
                    })
                }
            }

            function connect() {
                let ws = new WebSocket(`ws${isLocal ? '' : 's'}://${url}/${tournamentId}`);

                ws.onmessage = function (event) {
                    event = JSON.parse(event.data);
                    data = Object.assign(data, event || null);

                    if (typeof event?.tournament !== 'undefined' || typeof event?.season !== 'undefined') setTournamentInfos();
                    if (typeof event?.versus !== 'undefined') setTeams();
                    if (typeof event?.match !== 'undefined') setScoreboard();
                    if (typeof event?.players !== 'undefined') setPlayers();
                    if (typeof event?.match !== 'undefined' || typeof event?.entities !== 'undefined') setEntities();
                }

                ws.onerror = function () {
                    ws.close();
                }

                ws.onclose = function () {
                    ws = undefined;
                    setTimeout(connect);
                }
            }

            setTimeout(connect);
        </script>
    </body>
</html>
