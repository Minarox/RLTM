<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Scoreboard</title>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link rel="stylesheet" href="/assets/css/scoreboard.css">
    </head>
    <body>
        <main>
            <div>
                <p>Classement général</p>
                <p id="tournament"></p>
            </div>

            <article id="scoreboard"></article>
        </main>

        <script>
            const url = window.location.href.split('//')[1].split('/').slice(0, 2).join('/');
            const protocol = url.startsWith('localhost') ? 'ws' : 'wss';
            const isForOBS = new URLSearchParams(window.location.search).has('obs');
            let data = {};

            const scoreboard = document.getElementById('scoreboard');
            const tournament = document.getElementById('tournament');

            if (!isForOBS) {
                document.body.style.setProperty('background', 'black');
            }

            function setTournament() {
                let tournamentInfos = [];
                if (data?.tournament?.name) tournamentInfos.push(data.tournament.name);
                if (data?.season?.name) tournamentInfos.push(data.season.name);
                tournament.innerHTML = tournamentInfos?.join('&nbsp; - &nbsp;') || '&nbsp;';
            }

            function setScoreboard() {
                scoreboard.innerHTML = '';

                if (data?.teams && data?.results) {
                    let teams = data.teams
                        .map((team) => ({ ...team, score: 0 }));

                    data.results
                        .filter((versus) => versus.teamForfeit || versus.score[0] || versus.score[1])
                        .forEach((versus) => {
                            let winner;

                            if (versus.teamForfeit) {
                                if (versus.teamForfeit === 1) winner = teams.find((team) => team.id === versus.team1Id);
                                if (versus.teamForfeit === 2) winner = teams.find((team) => team.id === versus.team2Id);

                                if (winner) winner.score += 3;
                            } else {
                                let loser;

                                if (versus.score[0] > versus.score[1]) {
                                    winner = teams.find((team) => team.id === versus.team1Id);
                                    loser = teams.find((team) => team.id === versus.team2Id);
                                } else {
                                    winner = teams.find((team) => team.id === versus.team2Id);
                                    loser = teams.find((team) => team.id === versus.team1Id);
                                }

                                if (winner && loser) {
                                    winner.score += 3;
                                    loser.score += 1;
                                }
                            }
                        })

                    teams
                        .sort((a, b) => b.score - a.score)
                        .forEach((team, i) => {
                            const wrapper = document.createElement('div');
                            wrapper.id = team.id;
                            wrapper.style.border = `1px solid ${team.color || '#FFFFFF'}`;

                            const position = document.createElement('p');
                            position.innerHTML = i + 1;

                            const logo = document.createElement('img');
                            logo.src = team.logo ? `data:image/png;base64,${team.logo || ''}` : '';
                            logo.alt = `Logo ${team.name}`;
                            logo.title = team.name;

                            const name = document.createElement('p');
                            name.innerHTML = team.name;

                            const div = document.createElement('div');
                            div.append(logo, name);

                            const score = document.createElement('p');
                            score.innerHTML = team.score;

                            const separator = document.createElement('hr');
                            wrapper.append(position, separator, div, score);
                            scoreboard.appendChild(wrapper);
                        })
                }
            }

            function connect() {
                let ws = new WebSocket(`${protocol}://${url}/results`);

                ws.onmessage = function (event) {
                    event = JSON.parse(event.data);
                    data = Object.assign(data, event || null);

                    if (typeof event?.tournament !== 'undefined' || typeof event?.season !== 'undefined') setTournament();
                    if (typeof event?.teams !== 'undefined' || typeof event?.results !== 'undefined') setScoreboard();
                }

                ws.onerror = function () {
                    ws.close();
                }

                ws.onclose = function () {
                    ws = undefined;
                    setTimeout(connect);
                }
            }

            setTimeout(connect);
        </script>
    </body>
</html>
