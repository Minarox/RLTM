<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Overlay</title>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link rel="stylesheet" href="/assets/css/overlay.css">
    </head>
    <body>
        <main>
            <article id="tournament">
                &nbsp;
            </article>

            <article id="scoreboard">
                <!-- Team 1 -->
                <section>
                    <div class="img-wrapper">
                        <img id="logo-team1" src="" alt="Logo team 1" />
                    </div>
                    <p id="name-team1">&nbsp;</p>
                    <div id="score-versus-team1"></div>
                </section>

                <!-- Clock and score -->
                <section id="clock-and-score">
                    <p id="score-team1">0</p>
                    <p id="clock">0:00</p>
                    <p id="score-team2">0</p>
                    <p id="replay">Replay</p>
                    <p id="overtime">Overtime</p>
                </section>

                <!-- Team 2 -->
                <section>
                    <p id="name-team2">&nbsp;</p>
                    <div class="img-wrapper">
                        <img id="logo-team2" src="" alt="Logo team 2" />
                    </div>
                    <div id="score-versus-team2"></div>
                </section>
            </article>

            <article id="entities">
                <!-- Team 1 -->
                <section id="entities-team1"></section>

                <!-- Team 2 -->
                <section id="entities-team2"></section>
            </article>
        </main>

        <script>
            const isForOBS = new URLSearchParams(window.location.search).has('obs');
            let data = {};

            const tournament = document.getElementById('tournament');
            const nameTeam1 = document.getElementById('name-team1');
            const nameTeam2 = document.getElementById('name-team2');
            const logoTeam1 = document.getElementById('logo-team1');
            const logoTeam2 = document.getElementById('logo-team2');
            const scoreVersusTeam1 = document.getElementById('score-versus-team1');
            const scoreVersusTeam2 = document.getElementById('score-versus-team2');
            const clock = document.getElementById('clock');
            const scoreTeam1 = document.getElementById('score-team1');
            const scoreTeam2 = document.getElementById('score-team2');
            const replay = document.getElementById('replay');
            const overtime = document.getElementById('overtime');
            const entitiesTeam1 = document.getElementById('entities-team1');
            const entitiesTeam2 = document.getElementById('entities-team2');

            if (!isForOBS) {
                document.body.style.setProperty('background', 'black');
            }

            function setTournamentInfos() {
                let tournamentInfos = [];
                if (data?.tournament?.name) tournamentInfos.push(data.tournament.name);
                if (data?.season?.name) tournamentInfos.push(data.season.name);
                if (data?.versus?.versusScore?.length) tournamentInfos.push(`Match ${data.versus.versusScore[0] + data.versus.versusScore[1] + 1}`);
                tournament.innerHTML = tournamentInfos?.join('&nbsp; - &nbsp;') || '&nbsp;';
            }

            function setTeams() {
                nameTeam1.innerHTML = data?.versus?.team1?.name || '&nbsp;';
                nameTeam2.innerHTML = data?.versus?.team2?.name || '&nbsp;';

                logoTeam1.src = data?.versus?.team1?.logo ? `data:image/png;base64,${data.versus.team1.logo || ''}` : '';
                logoTeam1.style.opacity = data?.versus?.team1?.logo ? '1' : '0';

                logoTeam2.src = data?.versus?.team2?.logo ? `data:image/png;base64,${data.versus.team2.logo || ''}` : '';
                logoTeam2.style.opacity = data?.versus?.team2?.logo ? '1' : '0';

                scoreVersusTeam1.innerHTML = '';
                scoreVersusTeam2.innerHTML = '';

                if (data?.versus?.length && data?.versus?.versusScore) {
                    const highestScore = Math.max(data.versus.versusScore[0], data.versus.versusScore[1]);
                    let versusLength = data.versus.length - 2;
                    versusLength = highestScore >= versusLength ? highestScore + 1 : versusLength;

                    for (const team in data.versus.versusScore) {
                        const score = data.versus.versusScore[team];
                        for (let i = 0; i < versusLength; i++) {
                            const round = document.createElement('i');
                            if (i < score) round.classList.add("fill");

                            if (team == 0) scoreVersusTeam1.appendChild(round);
                            else scoreVersusTeam2.appendChild(round);
                        }
                    }
                }

                document.documentElement.style.setProperty('--color-team1', data?.versus?.team1?.color || '#2294f1');
                document.documentElement.style.setProperty('--color-team2', data?.versus?.team2?.color || '#f55521');
            }

            function setScoreboard() {
                if (data?.match) {
                    if (data.match?.duration === -1) {
                        clock.innerHTML = `${data.match?.overtime ? '+' : ''}${Math.floor(data.match?.clock / 60)}:${(data.match?.clock % 60).toString().padStart(2, "0")}`;
                    } else {
                        let time = data.match?.overtime ? data.match?.clock - data.match?.duration : data.match?.duration - data.match?.clock;
                        clock.innerHTML = `${data.match?.overtime ? '+' : ''}${Math.floor(time / 60)}:${(time % 60).toString().padStart(2, "0")}`;
                    }
                } else {
                    clock.innerHTML = '0:00';
                }

                scoreTeam1.innerHTML = data?.match?.scoreTeam1 || '0';
                scoreTeam2.innerHTML = data?.match?.scoreTeam2 || '0';

                replay.style.top = data?.match?.replay ? '100%' : 'calc(100% - 30px)';
                overtime.style.top = data?.match?.overtime ? '100%' : 'calc(100% - 30px)';
            }

            function setPlayers() {
                entitiesTeam1.innerHTML = '';
                entitiesTeam2.innerHTML = '';

                if (Array.isArray(data?.players)) {
                    data.players
                        .filter((player) => [0, 1].includes(player.teamIndex))
                        .forEach((player) => {
                            const playerUid = `${player.uid}|${player.name}`;
                            const playerEntitie = data?.entities?.cars?.find((entitie) => entitie.name === player.name && entitie.uid === player.uid);

                            const name = document.createElement('p');
                            name.innerHTML = player.name;
                            const boost = document.createElement('p');
                            boost.id = `boost-${playerUid}`;

                            const boostValue = playerEntitie?.boost || 0
                            boost.innerHTML = boostValue;
                            const text = document.createElement('div');
                            text.append(name, boost);

                            const barValue = document.createElement('i');
                            barValue.id = `bar-${playerUid}`;
                            barValue.style.width = `${boostValue}%`;
                            const bar = document.createElement('div');
                            bar.appendChild(barValue);

                            const wrapper = document.createElement('div');
                            wrapper.id = playerUid;
                            wrapper.append(text, bar);

                            if (player.teamIndex == 0) entitiesTeam1.appendChild(wrapper);
                            else entitiesTeam2.appendChild(wrapper);
                        })
                }
            }

            function setEntities() {
                if (data?.entities?.cars) {
                    data.entities.cars
                        .filter((player) => [0, 1].includes(player.teamIndex))
                        .forEach((player) => {
                            const playerUid = `${player.uid}|${player.name}`;

                            if (document.getElementById(`${playerUid}`)) {
                                const boostValue = player.boost || 0
                                const boost = document.getElementById(`boost-${playerUid}`);
                                if (boost) boost.innerHTML = boostValue;
                                const bar = document.getElementById(`bar-${playerUid}`);
                                if (bar) bar.style.width = `${boostValue}%`;
                            }
                        })
                }
            }

            function connect() {
                let ws = new WebSocket(window.location.href);

                ws.onmessage = function (event) {
                    event = JSON.parse(event.data);
                    data = Object.assign(data, event || null);

                    if (typeof event?.tournament !== 'undefined' || typeof event?.season !== 'undefined' || typeof event?.versus !== 'undefined') setTournamentInfos();
                    if (typeof event?.versus !== 'undefined') setTeams();
                    if (typeof event?.match !== 'undefined') setScoreboard();
                    if (typeof event?.players !== 'undefined') setPlayers();
                    if (typeof event?.entities !== 'undefined') setEntities();
                }

                ws.onerror = function () {
                    ws.close();
                }

                ws.onclose = function () {
                    ws = undefined;
                    setTimeout(connect);
                }
            }

            setTimeout(connect);
        </script>
    </body>
</html>
